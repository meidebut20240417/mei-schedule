name: Update schedule.json

on:
  schedule:
    # UTC基準。6時間ごとに実行
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated schedule.json
        run: |
          git config user.name "schedule-bot"
          git config user.email "actions@users.noreply.github.com"
          git add schedule.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Update schedule.json ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
