name: Update schedule.json

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-schedule-main
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated schedule.json
        run: |
          git config user.name "schedule-bot"
          git config user.email "schedule-bot@users.noreply.github.com"

          git add schedule.json

          if git diff --cached --quiet; then
            echo "schedule.json に変更はありません"
            exit 0
          fi

          git commit -m "Update schedule.json ($(date -u '+%Y-%m-%dT%H:%M:%SZ'))"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main