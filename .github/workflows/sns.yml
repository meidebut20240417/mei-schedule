name: SNS Update

on:
  workflow_dispatch:

  push:
    paths:
      - "sns.py"
      - ".github/workflows/sns.yml"

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: sns-update
  cancel-in-progress: false

jobs:
  update-sns:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore Instagram result cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/instagram-cache
          key: instagram-post-cache-${{ github.run_id }}
          restore-keys: |
            instagram-post-cache-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests instaloader

      - name: Fetch YouTube, X and Instagram posts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          RSSHUB_BASE_URL: ${{ secrets.RSSHUB_BASE_URL || 'https://rsshub.cmyr.dev' }}
          INSTAGRAM_CACHED: "1"
          INSTAGRAM_CACHE_FILE: ${{ runner.temp }}/instagram-cache/posts.json
          INSTAGRAM_SESSION_ID: ${{ secrets.INSTAGRAM_SESSION_ID }}
          INSTAGRAM_DS_USER_ID: ${{ secrets.INSTAGRAM_DS_USER_ID }}
        run: python sns.py

      - name: Commit sns.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sns.json

          if git diff --cached --quiet; then
            echo "No SNS changes."
            exit 0
          fi

          git commit -m "Update SNS data"

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              echo "Rebase conflict detected; keeping this run's generated sns.json."
              git checkout --theirs sns.json
              git add sns.json
              GIT_EDITOR=true git rebase --continue
              if git push origin HEAD:main; then
                exit 0
              fi
            fi

            echo "Push attempt $attempt failed; retrying..."
            sleep 3
          done

          echo "Failed to push sns.json after 5 attempts."
          exit 1
